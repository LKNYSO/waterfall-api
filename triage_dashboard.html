<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfall API - Manual Triage Operations Desk</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F7FAFC; color: #2D3748; padding: 40px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { background: #1A365D; color: white; padding: 24px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .header p { margin: 4px 0 0 0; font-size: 12px; color: #9AE6B4; }
        .card-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 20px; }
        .collision-card { background: white; border: 1px solid #E2E8F0; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .badge { background: #FED7D7; color: #9B2C2C; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .amount-badge { font-size: 24px; font-weight: 700; color: #2B6CB0; margin: 12px 0; }
        .meta-row { display: flex; gap: 40px; border-top: 1px dashed #E2E8F0; border-bottom: 1px dashed #E2E8F0; padding: 12px 0; margin: 16px 0; }
        .meta-item label { display: block; font-size: 11px; text-transform: uppercase; color: #718096; font-weight: 600; }
        .meta-item span { font-size: 14px; font-weight: 500; font-family: monospace; }
        .action-bar { display: flex; gap: 12px; justify-content: flex-end; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-resolve { background: #3182CE; color: white; }
        .btn-resolve:hover { background: #2B6CB0; }
        .btn-dismiss { background: #EDF2F7; color: #4A5568; }
        .btn-dismiss:hover { background: #E2E8F0; }
        .empty-state { text-align: center; padding: 60px; color: #718096; background: white; border-radius: 0 0 8px 8px; border: 1px solid #E2E8F0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🔒 Waterfall API: Manual Triage Center</h1>
                <p>POPIA Masking Active &bull; Relational Integrity Enforcement Hub</p>
            </div>
            <div><span class="badge">Live Audit Mode</span></div>
        </div>
        
        <div id="dashboard-content" class="card-grid">
            <!-- JavaScript populates data context dynamically here -->
        </div>
    </div>

    <script>
        async function fetchIsolatedCollisions() {
            try {
                const res = await fetch('/api/v1/internal/triage/queue');
                const data = await res.json();
                // 📡 TELEMETRY TRACE: Print the exact backend data structure to the browser inspector
                console.log("🚀 RAW API RESPONSE BODY:", data);
                const container = document.getElementById('dashboard-content');
                container.innerHTML = '';

                if (data.records.length === 0) {
                    container.innerHTML = '<div class="empty-state"><h3>✅ Triage Queue Clear</h3><p>Identity Anti-Collision Guards have resolved all incoming transactions automatically.</p></div>';
                    return;
                }

                data.records.forEach(rec => {
                    // indexing rec to access values
                    const indxAmount = rec[3];
                    const indxInvoiceId = rec[1];
                    const indxExpected = rec[2];
                    const indxStatus = rec[4];
                    const indxId = rec[0];

                    const card = document.createElement('div');
                    card.className = 'collision-card';
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong>Data Collision Alert: Identity Ambiguity Detected</strong>
                            <span class="badge">Cent Parity Match Conflict</span>
                        </div>
                        <div class="amount-badge">R ${parseFloat(indxAmount).toFixed(2)}</div>
                        <div class="meta-row">
                            <div class="meta-item">
                                <label>Invoice ID (Immutable Key)</label>
                                <span>${indxInvoiceId}</span>
                            </div>
                            <div class="meta-item">
                                <label>Expected Reference Target</label>
                                <span>${indxExpected}</span>
                            </div>
                            <div class="meta-item">
                                <label>System State</label>
                                <span style="color: #DD6B20;">${indxStatus}</span>
                            </div>
                        </div>
                        <div class="action-bar">
                            <button class="btn-dismiss" onclick="dismissRecord('${indxId}')">Isolate File Log</button>
                            <button class="btn-resolve" onclick="forceResolveMatch('${indxId}', '${indxInvoiceId}')">Credit Account Manually</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Dashboard synchronization exception:", err);
            }
        }

        async function forceResolveMatch(paymentId, invoiceId) {
            if (confirm(`Execute manual override? This will credit invoice ${invoiceId} and change status to COMPLETED.`)) {
                try {
                    const res = await fetch(`/api/v1/internal/triage/resolve/${paymentId}`, { method: 'POST' });
                    if (res.ok) {
                        alert("✅ Ledger transaction committed atomically. Outbound merchant webhook tasks initialized.");
                        fetchIsolatedCollisions();
                    }
                } catch (err) {
                    alert("System exception executing override.");
                }
            }
        }

        window.onload = fetchIsolatedCollisions;
    </script>
</body>
</html>
